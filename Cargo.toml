[workspace]
resolver = "2"
members = ["crates/core", "crates/model", "crates/kernels", "crates/runtime", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
insystem-core = { path = "crates/core" }
insystem-model = { path = "crates/model" }
insystem-kernels = { path = "crates/kernels" }
insystem-runtime = { path = "crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
anyhow = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 1
panic = "unwind"

[profile.dev]
opt-level = 1
